<!doctype html><html><head><style>:root{--x: rgb(255, 0, 0); --pct: 50}
@property --reg { syntax: "<number>"; inherits: true; initial-value: 0; }
.bar{position:relative;height:4px;width:400px;background:#eee}
.fill{position:absolute;left:0;top:0;bottom:0;background:blue;transition:width 1000ms linear;width:max(4px, calc(var(--pct)*1% - 2px))}
</style></head><body>
<svg width="40" height="40"><circle id="c" cx="20" cy="20" r="15" fill="none" stroke="var(--x)" stroke-width="3"/></svg>
<div class="bar" id="bar" style="--pct: 10"><div class="fill" id="fill"></div></div>
</body></html>
