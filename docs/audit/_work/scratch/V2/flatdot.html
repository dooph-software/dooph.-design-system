<!doctype html><html><head><meta charset="utf-8"><title>flatdot</title></head><body>
<pre id="out"></pre>
<script>
const D={sm:16,rg:22,md:32,xl:40}, S={sm:2,rg:2.5,md:3,xl:3};
function svgFor(k,p,withTrack){
  const d=D[k], sw=S[k], r=(d-sw)/2, C=2*Math.PI*r, g=2*sw, cx=d/2;
  const a=C*p, tl=p===0?C:Math.max(0,C-a-2*g), to=p===0?0:tl+C-(a+g), off=C*(1-p);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 ${d} ${d}">`+
   (withTrack?`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#00ff00" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${tl} ${C}" stroke-dashoffset="${to}" transform="rotate(-90 ${cx} ${cx})"/>`:'')+
   `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#0000ff" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cx})"/></svg>`;
}
function count(svg){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');x.drawImage(img,0,0);const dd=x.getImageData(0,0,200,200).data;let n=0;for(let i=0;i<dd.length;i+=4){if(dd[i+1]>200&&dd[i]<60&&dd[i+2]<60)n++;}res(n)};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
(async()=>{const lines=[];for(const k of ['sm','md','xl']){for(const p of [0.8,0.85,0.88,0.9,0.92,0.94,0.95,1]){lines.push(`${k} p=${p} greenPx=${await count(svgFor(k,p,true))}`);}}
 lines.push('control md p=0.9 no track: '+await count(svgFor('md',0.9,false)));
 lines.push('explicit zero dash test: '+await count(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.5" fill="none" stroke="#00ff00" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 91.106" stroke-dashoffset="0"/></svg>`));
 lines.push('explicit zero dash butt cap: '+await count(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.5" fill="none" stroke="#00ff00" stroke-width="3" stroke-linecap="butt" stroke-dasharray="0 91.106" stroke-dashoffset="0"/></svg>`));
 document.getElementById('out').textContent=lines.join('\n'); window.__done=lines;})();
</script></body></html>
